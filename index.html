<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency converter</title>
    <link rel="stylesheet" href="currency.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
<body>
    <div class="container">
    <h1>Currency Converter</h1>
    <form id="currency">
        <div class="amount">
            <p>Enter Amount:</p>
            <input type="number" id="amount" placeholder="Amount" required>
        </div>
        <div class="dropdown">
            <div class="from">
                <p>From:</p>
                <img src="https://flagsapi.com/US/shiny/64.png">
                <select id="from-country">
                
                </select>
            </div>
         
         <i id="switch-btn" class="fa-solid fa-arrow-right-arrow-left"></i>

            <div class="to">
                <p>To:</p>
                <img src="https://flagsapi.com/IN/shiny/64.png">

                <select id="to-country">
                </select>
            </div>
        </div>

            <div class="msg">1 USD = 80 INR</div>
            <button type="submit" id="convert-btn">Convert</button>
            <div class="result">
                <h2>Converted Amount:</h2>
                <p>
                    <span id="converted-amount">0</span>
                    <span id="to-text">INR</span>
                </p>
            </div>
    </form>
    </div>
    <script src="country.js" defer></script>
    <script src="currency.js" defer></script>
</body>
</html>
